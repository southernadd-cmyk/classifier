<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Lab | Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.21.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.4.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const { useState } = React;
const neuronOptions = [4, 8, 10, 16, 32, 64, 128];

function isNumeric(value) {
  const s = String(value ?? '').trim();
  return s !== '' && Number.isFinite(Number(s));
}
function parseEpochs(value) {
  const n = Number(value);
  if (!String(value).trim() || !Number.isSafeInteger(n) || n < 1 || n > 10000)
    throw new Error('Epochs must be a whole number from 1 to 10,000.');
  return n;
}
// Stable per-class shuffle: every architecture receives the same examples.
function splitData(rows, label) {
  let seed = 231119;
  const random = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
  const shuffle = array => {
    const copy = array.slice();
    for (let i = copy.length - 1; i > 0; --i) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  const groups = new Map();
  rows.forEach(row => {
    const key = String(row[label]).trim();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });
  if (groups.size < 2) throw new Error('Choose a target containing at least two classes.');
  if (groups.size > 50) throw new Error('Too many target classes. Choose a category, not a unique ID or a continuous number.');
  const train = [], val = [], test = [];
  for (const [name, group] of groups) {
    if (group.length < 5) throw new Error('Class "' + name + '" has fewer than 5 complete rows. Each class needs at least 5 for evaluation.');
    const shuffled = shuffle(group);
    const testCount = Math.max(1, Math.round(group.length * 0.15));
    const valCount = Math.max(1, Math.round(group.length * 0.15));
    test.push(...shuffled.slice(0, testCount));
    val.push(...shuffled.slice(testCount, testCount + valCount));
    train.push(...shuffled.slice(testCount + valCount));
  }
  return { train: shuffle(train), val: shuffle(val), test: shuffle(test) };
}
function buildSchema(rows, features) {
  return features.map(name => {
    const values = rows.map(row => String(row[name] ?? '').trim());
    if (values.every(isNumeric)) {
      const nums = values.map(Number);
      const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
      const variance = nums.reduce((a, b) => a + (b - mean) ** 2, 0) / nums.length;
      return { name, type: 'number', mean, deviation: Math.sqrt(variance) || 1 };
    }
    const categories = [...new Set(values)];
    if (categories.length > 80) throw new Error('Input "' + name + '" has too many unique text values. Avoid ID or free-text columns.');
    return { name, type: 'category', categories };
  });
}
function encode(row, schema, allowUnknown = false) {
  return schema.flatMap(feature => {
    const raw = String(row[feature.name] ?? '').trim();
    if (feature.type === 'number') {
      if (!isNumeric(raw)) throw new Error(feature.name + ' must be a valid number.');
      return [(Number(raw) - feature.mean) / feature.deviation];
    }
    const chosen = feature.categories.indexOf(raw);
    if (chosen === -1 && !allowUnknown) throw new Error('Unknown ' + feature.name + ': "' + raw + '". Use a value from the CSV.');
    return feature.categories.map((_, i) => Number(i === chosen));
  });
}
function Architecture({ layers, inputs, outputs }) {
  const counts = [inputs, ...layers, outputs];
  const sizes = counts.map(n => Math.min(7, n));
  const xpos = i => 28 + i * 640 / (counts.length - 1);
  const ypos = (i, j) => 22 + j * 119 / Math.max(1, sizes[i] - 1);
  return (
    <div className="rounded-xl bg-slate-50 border border-slate-200 p-3">
      <svg className="w-full" viewBox="0 0 700 190" role="img" aria-label={'Neural network: ' + layers.join(', ') + ' hidden neurons in each layer'}>
        {sizes.slice(0, -1).flatMap((size, i) =>
          Array.from({ length: size }, (_, j) =>
            Array.from({ length: sizes[i + 1] }, (_, k) =>
              <line key={i + '-' + j + '-' + k} x1={xpos(i)} y1={ypos(i, j)} x2={xpos(i + 1)} y2={ypos(i + 1, k)} stroke="#94a3b8" strokeOpacity=".2" strokeWidth=".9"/>
            )
          )
        )}
        {sizes.flatMap((size, i) => Array.from({ length: size }, (_, j) =>
          <circle key={i + '.' + j} cx={xpos(i)} cy={ypos(i,j)} r="5.5" fill={i === 0 ? '#0f766e' : i === sizes.length - 1 ? '#2563eb' : '#d97706'}/>
        ))}
        {counts.map((count, i) =>
          <g key={i} textAnchor="middle" fill="#475569" fontSize="11">
            <text x={xpos(i)} y="161">{i === 0 ? 'Input' : i === counts.length - 1 ? 'Output' : 'Hidden ' + i}</text>
            <text x={xpos(i)} y="177" fontWeight="bold">{count}</text>
          </g>
        )}
      </svg>
      <p className="text-xs text-slate-500">For readability, up to seven neurons per layer are drawn. Numbers show the actual sizes.</p>
    </div>
  );
}
function Curve({ points, kind }) {
  if (!points.length) return null;
  const acc = kind === 'accuracy';
  const trainKey = acc ? 'acc' : 'loss';
  const valKey = acc ? 'valAcc' : 'valLoss';
  const values = points.flatMap(p => [p[trainKey], p[valKey]]).filter(Number.isFinite);
  const topValue = acc ? 1 : Math.max(0.01, ...values) * 1.08;
  const xx = i => 46 + i * 603 / Math.max(1, points.length - 1);
  const yy = value => 182 - Math.min(1, Math.max(0, value / topValue)) * 162;
  const line = key => points.map((p,i) => xx(i) + ',' + yy(p[key])).join(' ');
  return (
    <div className="rounded-xl border border-slate-200 p-3">
      <svg className="w-full" viewBox="0 0 680 221" role="img" aria-label={'Training and validation ' + kind + ' graph'}>
        {[0,.25,.5,.75,1].map(factor =>
          <g key={factor}>
            <line x1="46" x2="649" y1={yy(factor*topValue)} y2={yy(factor*topValue)} stroke="#e2e8f0"/>
            <text x="40" y={yy(factor*topValue)+4} fontSize="11" textAnchor="end" fill="#64748b">{acc ? (factor*100).toFixed(0) + '%' : (factor*topValue).toFixed(2)}</text>
          </g>
        )}
        <polyline points={line(trainKey)} fill="none" stroke="#0f766e" strokeWidth="2.5"/>
        <polyline points={line(valKey)} fill="none" stroke="#d97706" strokeWidth="2.5"/>
        <text x="46" y="205" fontSize="11" fill="#64748b">Epoch {points[0].epoch}</text>
        <text x="649" y="205" fontSize="11" fill="#64748b" textAnchor="end">Epoch {points[points.length-1].epoch}</text>
      </svg>
      <p className="text-xs text-slate-600"><span className="text-teal-700 font-bold">● Training</span> &nbsp;&nbsp; <span className="text-amber-600 font-bold">● Validation</span></p>
    </div>
  );
}
const fieldStyle = 'w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:ring-2 focus:ring-teal-600 focus:outline-none';
const panelStyle = 'rounded-2xl border border-slate-200 bg-white p-5 shadow-sm';
const mainButton = 'rounded-lg bg-teal-700 px-5 py-2.5 font-semibold text-white hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-40';
function Explanation({ title, children }) {
  return (
    <details className="group mt-3 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
      <summary className="cursor-pointer select-none font-medium text-teal-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
        {title}
      </summary>
      <div className="mt-2 space-y-2 leading-relaxed text-slate-700">{children}</div>
    </details>
  );
}
function App() {
  const [csv, setCsv] = useState(null);
  const [columns, setColumns] = useState([]);
  const [label, setLabel] = useState('');
  const [features, setFeatures] = useState([]);
  const [layers, setLayers] = useState([10]);
  const [activation, setActivation] = useState('relu');
  const [epochs, setEpochs] = useState('150');
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('');
  const [model, setModel] = useState(null);
  const [schema, setSchema] = useState([]);
  const [classes, setClasses] = useState([]);
  const [history, setHistory] = useState([]);
  const [metrics, setMetrics] = useState(null);
  const [chartKind, setChartKind] = useState('accuracy');
  const [predictionValues, setPredictionValues] = useState({});
  const [prediction, setPrediction] = useState('');

  const reset = () => {
    if (model) model.dispose();
    setModel(null); setSchema([]); setClasses([]); setHistory([]); setMetrics(null);
    setPrediction(''); setPredictionValues({}); setStatus('');
  };
  const upload = event => {
    const file = event.target.files[0];
    if (!file) return;
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: result => {
        reset();
        const rows = result.data.filter(row => Object.values(row).some(x => String(x ?? '').trim()));
        setCsv(rows);
        setColumns(result.meta.fields || Object.keys(rows[0] || {}));
        setLabel(''); setFeatures([]);
        setStatus(rows.length + ' rows loaded.' + (result.errors.length ? ' Parsing warnings: ' + result.errors.length : ''));
      },
      error: error => setStatus('Cannot open CSV: ' + error.message),
    });
    event.target.value = '';
  };
  const changeLayers = updated => { reset(); setLayers(updated); };

  const train = async () => {
    if (busy) return;
    if (!csv || !label || !features.length) { setStatus('Select a target and at least one input feature.'); return; }
    const allocated = [];
    let newModel = null;
    try {
      const count = parseEpochs(epochs);
      const complete = csv.filter(row => String(row[label] ?? '').trim() &&
        features.every(f => String(row[f] ?? '').trim()));
      const split = splitData(complete, label);
      const labels = [...new Set(split.train.map(row => String(row[label]).trim()))];
      const prepared = buildSchema(split.train, features);
      const inputCount = encode(split.train[0], prepared).length;
      if (inputCount > 500) throw new Error('The selected features expand to more than 500 inputs. Remove high-cardinality columns.');
      const pair = rows => {
        const xs = tf.tensor2d(rows.map(row => encode(row, prepared, true)));
        const ys = tf.tensor2d(rows.map(row => labels.map(name => Number(String(row[label]).trim() === name))));
        allocated.push(xs, ys);
        return [xs, ys];
      };
      const [trainX, trainY] = pair(split.train);
      const [valX, valY] = pair(split.val);
      const [testX, testY] = pair(split.test);
      reset();
      setBusy(true);
      setStatus('Training…');
      newModel = tf.sequential();
      layers.forEach((units, index) => {
        const settings = { units, activation };
        if (index === 0) settings.inputShape = [inputCount];
        newModel.add(tf.layers.dense(settings));
      });
      newModel.add(tf.layers.dense({ units: labels.length, activation: 'softmax' }));
      newModel.compile({ optimizer: 'adam', loss: 'categoricalCrossentropy', metrics: ['accuracy'] });
      const interval = Math.max(1, Math.ceil(count / 160));
      let last;
      await newModel.fit(trainX, trainY, {
        epochs: count, shuffle: true, batchSize: 32, validationData: [valX, valY],
        callbacks: { onEpochEnd: (epoch, logs) => {
          last = {
            epoch: epoch + 1, acc: logs.acc ?? logs.accuracy,
            valAcc: logs.val_acc ?? logs.val_accuracy,
            loss: logs.loss, valLoss: logs.val_loss,
          };
          if (epoch === 0 || (epoch + 1) % interval === 0 || epoch === count - 1) {
            setHistory(prev => prev.concat(last));
            setStatus('Epoch ' + (epoch + 1) + '/' + count + ' · training ' + (last.acc * 100).toFixed(1) +
              '% · validation ' + (last.valAcc * 100).toFixed(1) + '%');
          }
        }},
      });
      const evaluated = newModel.evaluate(testX, testY);
      const resultTensors = Array.isArray(evaluated) ? evaluated : [evaluated];
      const testLoss = (await resultTensors[0].data())[0];
      const testAcc = (await resultTensors[1].data())[0];
      resultTensors.forEach(t => t.dispose());
      setModel(newModel);
      newModel = null;
      setSchema(prepared); setClasses(labels);
      setMetrics({
        train: last.acc, validation: last.valAcc, test: testAcc, testLoss,
        sizes: [split.train.length, split.val.length, split.test.length],
        skipped: csv.length - complete.length, inputs: inputCount, outputs: labels.length
      });
      setStatus('Training finished. Test accuracy is measured on previously unseen rows.');
    } catch (error) {
      setStatus('Training failed: ' + error.message);
    } finally {
      allocated.forEach(t => t.dispose());
      if (newModel) newModel.dispose();
      setBusy(false);
    }
  };
  const predict = async () => {
    let input, result;
    try {
      input = tf.tensor2d([encode(predictionValues, schema)]);
      result = model.predict(input);
      const probabilities = (await result.array())[0];
      const index = probabilities.indexOf(Math.max(...probabilities));
      setPrediction('Predicted: ' + classes[index] + ' · model score: ' + (probabilities[index] * 100).toFixed(1) + '%');
    } catch (error) { setPrediction('Cannot predict: ' + error.message); }
    finally { if (input) input.dispose(); if (result) result.dispose(); }
  };
  const exportModel = async () => {
    if (!model) return;
    try {
      await model.save('downloads://neural-network-lab');
      const metadata = { version: 1, schema, classes, layers, activation, metrics,
        note: 'Use schema mean/deviation and category one-hot encoding before prediction.' };
      const blob = new Blob([JSON.stringify(metadata, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'neural-network-lab-preprocessing.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus('Model and preprocessing metadata exported. Keep all three files together.');
    } catch (error) { setStatus('Export failed: ' + error.message); }
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900">
      <main className="mx-auto max-w-6xl p-4 sm:p-7">
        <header className="py-5 mb-5">
          <p className="text-sm font-bold tracking-widest uppercase text-teal-700">Machine learning · classroom lab</p>
          <h1 className="mt-2 text-4xl font-bold tracking-tight">Neural Network Lab</h1>
          <p className="mt-3 text-slate-600 max-w-3xl">Design, train and test an artificial neural network. Compare different numbers of layers, neurons and activation functions using your own CSV data.</p>
          <p className="mt-2 max-w-3xl text-sm text-slate-600">A neural network learns relationships between examples and their known answers, then tries to classify new examples. Start with the default settings and change one thing at a time.</p>
          <div className="max-w-3xl">
            <Explanation title="What kind of AI is this?">
              <p>This is <strong>supervised machine learning</strong>: the CSV supplies examples with correct labels, and the network adjusts its connections to make predictions that match those labels.</p>
              <p>It is a <strong>feedforward neural network</strong> (a multilayer perceptron). Information moves from the input features, through hidden layers, to a classification output. The model learns from data rather than using manually written classification rules.</p>
            </Explanation>
          </div>
        </header>
        <div className="grid gap-5 lg:grid-cols-3">
          <section className={panelStyle}>
            <h2 className="text-xl font-bold">1. Choose your data</h2>
            <p className="text-sm text-slate-500 mt-1">Upload a CSV with column headers. Each row is an example; each column describes it.</p>
            <Explanation title="What should my CSV contain?">
              <p>Choose data with a <strong>category to predict</strong> and several useful input columns. For banknotes, the inputs could be image measurements and the target could be genuine/forged. For mushrooms, inputs could describe physical features and the target could be edible/poisonous.</p>
              <p>The target must contain at least two classes, with at least five complete examples of each. Rows missing a selected input or target are omitted. More representative data usually produces more reliable results.</p>
            </Explanation>
            <input type="file" accept=".csv" disabled={busy} onChange={upload} aria-label="Upload a CSV file"
              className="mt-4 block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-teal-50 file:px-3 file:py-2 file:font-medium file:text-teal-800"/>
            {csv && <p className="mt-3 text-sm text-slate-600">{csv.length.toLocaleString()} rows · {columns.length} columns</p>}
            {columns.length > 0 && <>
              <label className="block mt-5 font-semibold" htmlFor="target">Target to predict</label>
              <p className="mt-1 text-xs text-slate-600">The answer the network will learn to predict (also called the label or class).</p>
              <select id="target" value={label} disabled={busy} className={fieldStyle + ' mt-2'}
                onChange={e => { reset(); setLabel(e.target.value); setFeatures(prev => prev.filter(f => f !== e.target.value)); }}>
                <option value="">Choose a target column</option>
                {columns.map(name => <option key={name} value={name}>{name}</option>)}
              </select>
              <div className="mt-5 flex items-center justify-between">
                <h3 className="font-semibold">Input features</h3><span className="text-xs text-slate-500">{features.length} selected</span>
              </div>
              <p className="text-xs text-slate-600 mt-1">Features are the clues the network uses to make a prediction. Select measurements or categories that could genuinely help.</p>
              <Explanation title="Which features should I choose?">
                <p>For banknotes, try numerical measurements such as variance, skewness, curtosis and entropy. For mushrooms, try cap shape, colour, odour and gill size.</p>
                <p>Avoid unique IDs, names and anything that <strong>reveals the answer directly</strong> (data leakage). For example, when predicting Titanic survival, do not select an <em>alive</em> column as an input. Try using fewer features, then compare the results.</p>
              </Explanation>
              <div className="mt-2 p-3 space-y-2 max-h-72 overflow-y-auto rounded-lg border border-slate-200">
                {columns.filter(name => name !== label).map(name =>
                  <label key={name} className="flex items-start gap-2 text-sm">
                    <input type="checkbox" className="mt-1 accent-teal-700" checked={features.includes(name)} disabled={busy}
                      onChange={() => { reset(); setFeatures(prev => prev.includes(name) ? prev.filter(f => f !== name) : [...prev, name]); }}/>
                    <span className="break-all">{name}</span>
                  </label>
                )}
              </div>
            </>}
          </section>
          <section className={panelStyle + ' lg:col-span-2'}>
            <div className="flex flex-wrap justify-between gap-3">
              <div><h2 className="text-xl font-bold">2. Build your network</h2>
                <p className="mt-1 text-sm text-slate-500">Start with the original 10-neuron network, or add hidden layers.</p>
                <p className="mt-2 text-sm text-slate-600">A neuron combines the inputs it receives, applies an activation function, then passes a value onwards. Training changes the strengths of its connections (weights).</p>
                </div>
              <span className="self-start rounded-full bg-teal-50 px-3 py-1 text-sm font-semibold text-teal-800">
                {layers.reduce((sum, n) => sum + n, 0)} hidden neurons
              </span>
            </div>
            <div className="mt-5 grid gap-4 sm:grid-cols-2">
              <div>
                <label className="text-sm font-semibold" htmlFor="activation">Activation function</label>
                <select id="activation" className={fieldStyle + ' mt-2'} disabled={busy} value={activation}
                  onChange={e => { reset(); setActivation(e.target.value); }}>
                  <option value="relu">ReLU</option><option value="sigmoid">Sigmoid</option><option value="tanh">Tanh</option>
                </select>
                <p className="mt-2 text-xs leading-relaxed text-slate-600">
                  {activation === 'relu' && 'ReLU passes positive signals through and turns negative signals into zero. Fast and a good default for most datasets.'}
                  {activation === 'sigmoid' && 'Sigmoid squeezes values between 0 and 1. It is smooth but can learn slowly when signals become very large or small.'}
                  {activation === 'tanh' && 'Tanh squeezes values between -1 and +1. It preserves negative signals but can also suffer from slow learning at extremes.'}
                </p>
                <Explanation title="Compare ReLU, sigmoid and tanh">
                  <p>An <strong>activation function</strong> determines how a neuron responds. Without nonlinear activations, adding hidden layers would not let the network learn more complex patterns.</p>
                  <p><strong>ReLU:</strong> max(0, x). For input -2 it outputs 0; for +2 it outputs 2. Usually a sensible starting point, although some neurons may become stuck at zero.</p>
                  <p><strong>Sigmoid:</strong> produces values from 0 to 1. For input 0 it outputs 0.5. It can suffer from vanishing gradients, slowing training.</p>
                  <p><strong>Tanh:</strong> produces values from -1 to +1. For input 0 it outputs 0. Its values are centred on zero, but it can also have vanishing gradients.</p>
                  <p>These choices change the <strong>hidden layers</strong>. The final output uses <strong>softmax</strong> regardless: it produces class scores that sum to 100%.</p>
                </Explanation>
              </div>
              <div>
                <label className="text-sm font-semibold" htmlFor="epochs">Training epochs</label>
                <input id="epochs" type="number" min="1" max="10000" step="1" disabled={busy} value={epochs}
                  className={fieldStyle + ' mt-2'} onChange={e => { reset(); setEpochs(e.target.value); }}/>
                <p className="mt-1 text-xs text-slate-600">One epoch means the network has worked through the training examples once. Default: 150.</p>
                <Explanation title="Do more epochs always help?">
                  <p>No. Each epoch gives the network another chance to adjust its weights using <strong>backpropagation</strong> and the Adam optimiser. More epochs can improve learning, but too many can make it memorise training examples rather than generalise.</p>
                  <p>Compare 20, 150 and 500 epochs using the same data and network. Watch the validation curve: if training improves while validation gets worse, that may be <strong>overfitting</strong>.</p>
                </Explanation>
              </div>
            </div>
            <h3 className="font-semibold mt-5">Hidden layers</h3>
            <p className="mt-1 text-sm text-slate-600">Hidden layers sit between the input and output. Additional layers let the network build more complex combinations of features; they do not automatically improve accuracy.</p>
            <Explanation title="What is the difference between more layers and more neurons?">
              <p><strong>More layers (depth)</strong> allow successive transformations: a later layer can combine patterns found by earlier layers. <strong>More neurons (width)</strong> give a layer greater capacity to detect different patterns.</p>
              <p>For small tabular datasets, one or two hidden layers may be enough. Larger networks use more memory and training time and may <strong>overfit</strong> limited datasets. Compare a small 10-neuron network with 32 → 16 and 64 → 32 → 16, keeping the data and epochs the same.</p>
            </Explanation>
            <div className="mt-2 grid gap-3 sm:grid-cols-2">
              {layers.map((units, i) =>
                <div key={i} className="flex items-center gap-2 rounded-xl bg-slate-50 p-3">
                  <label className="flex-1 text-sm" htmlFor={'layer-' + i}>Layer {i + 1}</label>
                  <select id={'layer-' + i} className="rounded-lg border border-slate-300 p-2" value={units} disabled={busy}
                    onChange={e => changeLayers(layers.map((n, j) => j === i ? Number(e.target.value) : n))}>
                    {neuronOptions.map(n => <option value={n} key={n}>{n} neurons</option>)}
                  </select>
                  <button type="button" aria-label={'Remove layer ' + (i+1)} disabled={busy || layers.length === 1}
                    onClick={() => changeLayers(layers.filter((_, j) => j !== i))}
                    className="px-2 py-2 rounded hover:bg-slate-200 disabled:opacity-30">×</button>
                </div>
              )}
            </div>
            <button type="button" disabled={busy || layers.length >= 4} onClick={() => changeLayers([...layers, 16])}
              className="mt-3 rounded-lg border border-teal-700 px-4 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-40">
              + Add hidden layer
            </button>
            <div className="mt-5">
              <h3 className="mb-2 font-semibold">Network architecture preview</h3>
              <Architecture layers={layers} inputs={metrics ? metrics.inputs : features.length || 4} outputs={metrics ? metrics.outputs : 2}/>
              <p className="mt-2 text-xs leading-relaxed text-slate-600">Left: input features. Middle: the hidden layers you selected. Right: output classes. Lines represent connections with trainable weights, not paths chosen manually.</p>
              <Explanation title="Why might the input and output counts change?">
                <p>Each numerical feature supplies one input. A text feature is converted to several one-hot inputs, one for each known category; this is why the total input count may be higher than the number of selected columns.</p>
                <p>The output layer has one neuron for each category in the target. Its <strong>softmax</strong> function gives a relative score for each class. Before training, the diagram shows illustrative input and output counts.</p>
              </Explanation>
            </div>
            <p className="mt-3 text-xs leading-relaxed text-slate-600">Before training, numerical values are standardised and text categories are one-hot encoded. This makes the inputs easier for the network to learn from.</p>
            <Explanation title="What happens to the data before training?">
              <p><strong>Standardisation</strong> rescales numerical inputs using the training set mean and standard deviation, so a large-number column does not dominate just because of its units.</p>
              <p><strong>One-hot encoding</strong> converts a text category such as red/blue into separate 0/1 inputs. The mean, standard deviation and category vocabulary are learned from training rows only, not from validation or test rows. Unknown test categories are encoded as all zeros.</p>
            </Explanation>
            <div className="mt-5 flex flex-wrap items-center gap-3">
              <button type="button" className={mainButton} disabled={busy || !csv || !label || !features.length} onClick={train}>
                {busy ? 'Training…' : 'Train network'}
              </button>
              <span className="text-xs text-slate-600">Roughly 70% training · 15% validation · 15% testing</span>
            </div>
            <Explanation title="What happens when I press Train network?">
              <p>The lab separates examples into three groups while preserving class proportions. <strong>Training</strong> rows update the network's weights. <strong>Validation</strong> rows are checked after each epoch to see how learning generalises. <strong>Test</strong> rows are held back until the end for one final evaluation.</p>
              <p>The split is repeatable, but the initial neural-network weights and training process can still make results vary between runs. Change one setting at a time when comparing experiments.</p>
            </Explanation>
            <p className="mt-4 text-sm" role="status" aria-live="polite">{status}</p>
          </section>
        </div>
        {history.length > 0 && <section className={panelStyle + ' mt-6'}>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-xl font-bold">3. Learning curves</h2>
              <p className="text-sm text-slate-600 mt-1">The curves show how the model changed during training. Ideally, training and validation both improve rather than moving apart.</p>
              <Explanation title="How do I read the accuracy and loss graphs?">
                <p><strong>Accuracy</strong> is the proportion of examples classified correctly. Higher is better. <strong>Loss</strong> measures how wrong the predictions are, including how confident the model was when wrong. Lower is better.</p>
                <p>Compare the <strong>training</strong> curve (examples the network learns from) with the <strong>validation</strong> curve (examples it does not train on). If training improves but validation worsens, it may be overfitting. If neither improves, the network may be underfitting or the features may not be informative.</p>
              </Explanation>
            </div>
            <div className="flex gap-2" role="group" aria-label="Chart mode">
              {['accuracy','loss'].map(kind =>
                <button type="button" key={kind} aria-pressed={chartKind === kind} onClick={() => setChartKind(kind)}
                  className={'rounded-lg px-3 py-2 text-sm font-semibold ' + (chartKind === kind ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600')}>
                  {kind === 'accuracy' ? 'Accuracy' : 'Loss'}
                </button>
              )}
            </div>
          </div>
          <div className="mt-4"><Curve points={history} kind={chartKind}/></div>
          {metrics && <>
            <div className="mt-4 grid gap-3 sm:grid-cols-3">
              {[
                ['Training accuracy',metrics.train,metrics.sizes[0], 'Correct predictions on examples used to update the model.'],
                ['Validation accuracy',metrics.validation,metrics.sizes[1], 'Accuracy on separate examples checked during training.'],
                ['Unseen test accuracy',metrics.test,metrics.sizes[2], 'Final check using examples kept out of training and validation.']
              ].map(([name, value, size, help]) =>
                <div key={name} className="rounded-xl bg-slate-50 p-4">
                  <p className="text-sm font-medium text-slate-600">{name}</p>
                  <p className="text-3xl font-bold mt-1">{(value*100).toFixed(1)}%</p>
                  <p className="text-xs text-slate-500 mt-1">{size} rows</p>
                  <p className="mt-2 text-xs leading-relaxed text-slate-600">{help}</p>
                </div>
              )}
            </div>
            <p className="mt-3 text-sm text-slate-600">{metrics.skipped ? metrics.skipped + ' incomplete rows were omitted. ' : ''}
              The test examples were not used for training or validation. The data split is repeatable for fair comparisons.</p>
            <Explanation title="Which accuracy should I trust?">
              <p><strong>Training accuracy</strong> is usually optimistic because the model already saw those examples. <strong>Validation accuracy</strong> helps compare settings during development. <strong>Test accuracy</strong> estimates performance on unseen data, but should be used sparingly: repeatedly choosing settings based on test results can also bias your conclusions.</p>
              <p>A small test set or an imbalanced dataset can make accuracy misleading. For classroom work, compare the three scores and think about class balance, errors and the size of each dataset.</p>
            </Explanation>
          </>}
        </section>}
        {model && !busy && <section className={panelStyle + ' mt-6'}>
          <h2 className="text-xl font-bold">4. Try a new prediction</h2>
          <p className="mt-1 text-sm text-slate-600">Type a new example using the same measurements or categories as the training CSV. The trained model predicts a class without retraining.</p>
          <Explanation title="What does a prediction mean?">
            <p>Each input box corresponds to one selected feature. Use numerical values in their original units: the lab automatically applies the same standardisation as during training. Text values must match a category from the training data.</p>
            <p>The predicted class has the highest <strong>softmax score</strong>. A score of 95% does not necessarily mean the model is correct 95% of the time; these scores are not calibrated probabilities. A model can make confident mistakes.</p>
          </Explanation>
          <div className="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {schema.map((feature, i) =>
              <div key={feature.name}>
                <label htmlFor={'predict-' + i} className="text-sm font-semibold">{feature.name}</label>
                <input id={'predict-' + i} className={fieldStyle + ' mt-2'} value={predictionValues[feature.name] ?? ''}
                  type={feature.type === 'number' ? 'number' : 'text'} step={feature.type === 'number' ? 'any' : undefined}
                  list={feature.type === 'category' ? 'categories-' + i : undefined}
                  onChange={e => setPredictionValues(prev => ({ ...prev, [feature.name]: e.target.value }))}/>
                {feature.type === 'category' && <datalist id={'categories-' + i}>
                  {feature.categories.map(value => <option key={value} value={value}/>)}
                </datalist>}
              </div>
            )}
          </div>
          <div className="mt-5 flex flex-wrap items-center gap-4">
            <button type="button" className={mainButton} onClick={predict}>Predict class</button>
            <span role="status" className="font-medium">{prediction}</span>
          </div>
          <p className="mt-2 text-xs text-slate-500">Model scores are not calibrated probabilities. Classroom predictions should not guide safety-critical decisions.</p>
          <button type="button" className="mt-5 rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50"
            onClick={exportModel}>Export model and preprocessing metadata</button>
          <Explanation title="What do the exported files contain?">
            <p>The export downloads a TensorFlow.js model structure, its learned weights, and a separate JSON file describing input columns, text categories and numerical scaling values. All three files are needed to interpret new inputs correctly outside this page.</p>
            <p>Export saves your trained model; it does not save or publish the uploaded CSV.</p>
          </Explanation>
        </section>}
        <footer className="py-8 text-sm text-slate-500">Runs in your browser using TensorFlow.js · Your CSV stays on your device · Bigger networks may train slowly</footer>
      </main>
    </div>
  );
}
ReactDOM.render(<App />, document.getElementById('root'));

</script>
</body>
</html>
