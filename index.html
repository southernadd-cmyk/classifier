        </section>}
        {model && !busy && <section className={panelStyle + ' mt-6'}>
          <h2 className="text-xl font-bold">4. Try a new prediction</h2>
          <p className="mt-1 text-sm text-slate-500">Enter numbers or known text categories from the CSV.</p>
          <div className="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {schema.map((feature, i) =>
              <div key={feature.name}>
                <label htmlFor={'predict-' + i} className="text-sm font-semibold">{feature.name}</label>
                <input id={'predict-' + i} className={fieldStyle + ' mt-2'} value={predictionValues[feature.name] ?? ''}
                  type={feature.type === 'number' ? 'number' : 'text'} step={feature.type === 'number' ? 'any' : undefined}
                  list={feature.type === 'category' ? 'categories-' + i : undefined}
                  onChange={e => setPredictionValues(prev => ({ ...prev, [feature.name]: e.target.value }))}/>
                {feature.type === 'category' && <datalist id={'categories-' + i}>
                  {feature.categories.map(value => <option key={value} value={value}/>)}
                </datalist>}
              </div>
            )}
          </div>
          <div className="mt-5 flex flex-wrap items-center gap-4">
            <button type="button" className={mainButton} onClick={predict}>Predict class</button>
            <span role="status" className="font-medium">{prediction}</span>
          </div>
          <p className="mt-2 text-xs text-slate-500">Model scores are not calibrated probabilities. Classroom predictions should not guide safety-critical decisions.</p>
          <button type="button" className="mt-5 rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50"
            onClick={exportModel}>Export model and preprocessing metadata</button>
        </section>}
        <footer className="py-8 text-sm text-slate-500">Runs in your browser using TensorFlow.js · Your CSV stays on your device · Bigger networks may train slowly</footer>
      </main>
    </div>
  );
}
ReactDOM.render(<App />, document.getElementById('root'));

</script>
</body>
</html>
