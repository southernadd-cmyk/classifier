<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lab Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.21.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.4.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A feature can be numerical or categorical (text). Both must be encoded
    // consistently at training time and when making a prediction.
    function isNumericValue(value) {
      const raw = String(value ?? '').trim();
      return raw !== '' && Number.isFinite(Number(raw));
    }

    function makeFeatureSchema(rows, selectedFeatures) {
      return selectedFeatures.map(name => {
        const values = rows.map(row => String(row[name] ?? '').trim());
        if (values.every(isNumericValue)) {
          return { name, type: 'number' };
        }
        return { name, type: 'category', categories: [...new Set(values)] };
      });
    }

    function encodeFeatures(row, schema) {
      return schema.flatMap(feature => {
        const raw = String(row[feature.name] ?? '').trim();
        if (feature.type === 'number') {
          if (!isNumericValue(raw)) {
            throw new Error(`${feature.name} must contain a valid number.`);
          }
          return [Number(raw)];
        }
        const index = feature.categories.indexOf(raw);
        if (index === -1) {
          throw new Error(`"${raw}" is not a known value for ${feature.name}. Enter a category from the training CSV.`);
        }
        return feature.categories.map((_, i) => i === index ? 1 : 0);
      });
    }

    function parseEpochs(value) {
      const raw = String(value).trim();
      const count = Number(raw);
      if (!raw || !Number.isSafeInteger(count) || count < 1 || count > 10000) {
        throw new Error('Epochs must be a whole number between 1 and 10,000.');
      }
      return count;
    }

    function App() {
      const [csvData, setCsvData] = useState(null);
      const [columns, setColumns] = useState([]);
      const [label, setLabel] = useState('');
      const [features, setFeatures] = useState([]);
      const [model, setModel] = useState(null);
      const [trainingStatus, setTrainingStatus] = useState('');
      const [predictionInput, setPredictionInput] = useState({});
      const [predictionResult, setPredictionResult] = useState('');
      const [epochs, setEpochs] = useState('150');
      const [isTraining, setIsTraining] = useState(false);
      const [featureSchema, setFeatureSchema] = useState([]);
      const [trainedLabels, setTrainedLabels] = useState([]);

      const resetTraining = () => {
        if (model) model.dispose();
        setModel(null);
        setTrainingStatus('');
        setPredictionInput({});
        setPredictionResult('');
        setFeatureSchema([]);
        setTrainedLabels([]);
      };

      // Handle CSV upload
      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: (result) => {
            resetTraining();
            const rows = result.data.filter(row => Object.values(row).some(value => String(value ?? '').trim() !== ''));
            setCsvData(rows);
            setColumns(result.meta.fields || Object.keys(rows[0] || {}));
            setLabel('');
            setFeatures([]);
            if (result.errors.length) {
              setTrainingStatus(`CSV imported with ${result.errors.length} parsing warning(s).`);
            }
          },
          error: (error) => setTrainingStatus('Error parsing CSV: ' + error.message),
        });
      };

      // Create and train model
      const trainModel = async () => {
        if (isTraining) return;
        if (!csvData || !label || features.length === 0) {
          setTrainingStatus('Please upload a CSV, select a label and at least one feature.');
          return;
        }

        let tfModel = null;
        let xsTensor = null;
        let ysTensor = null;
        try {
          const epochCount = parseEpochs(epochs);
          const rows = csvData.filter(row =>
            String(row[label] ?? '').trim() !== '' &&
            features.every(feature => String(row[feature] ?? '').trim() !== '')
          );
          if (rows.length < 2) throw new Error('Not enough complete CSV rows to train.');
          const labels = [...new Set(rows.map(row => String(row[label]).trim()))];
          if (labels.length < 2) throw new Error('The label column needs at least two distinct classes.');

          const schema = makeFeatureSchema(rows, features);
          const xs = rows.map(row => encodeFeatures(row, schema));
          const ys = rows.map(row => {
            const index = labels.indexOf(String(row[label]).trim());
            return labels.map((_, i) => i === index ? 1 : 0);
          });

          tfModel = tf.sequential();
          tfModel.add(tf.layers.dense({
            units: 10,
            activation: 'relu',
            inputShape: [xs[0].length],
          }));
          tfModel.add(tf.layers.dense({
            units: labels.length,
            activation: 'softmax',
          }));
          tfModel.compile({
            optimizer: 'adam',
            loss: 'categoricalCrossentropy',
            metrics: ['accuracy'],
          });

          xsTensor = tf.tensor2d(xs);
          ysTensor = tf.tensor2d(ys);
          setIsTraining(true);
          setTrainingStatus('Training...');
          await tfModel.fit(xsTensor, ysTensor, {
            epochs: epochCount,
            callbacks: {
              onEpochEnd: (epoch, logs) => {
                const accuracy = logs.acc ?? logs.accuracy;
                const metric = accuracy == null ? '' : `, Accuracy: ${(accuracy * 100).toFixed(2)}%`;
                setTrainingStatus(`Training... Epoch ${epoch + 1}/${epochCount}${metric}`);
              },
            },
          });

          if (model) model.dispose();
          setModel(tfModel);
          tfModel = null; // The trained model is now owned by React state.
          setFeatureSchema(schema);
          setTrainedLabels(labels);
          setPredictionInput({});
          setPredictionResult('');
          setTrainingStatus(`Training complete: ${epochCount} epochs, ${rows.length} examples.`);
        } catch (error) {
          setTrainingStatus(`Training failed: ${error.message}`);
        } finally {
          if (xsTensor) xsTensor.dispose();
          if (ysTensor) ysTensor.dispose();
          if (tfModel) tfModel.dispose();
          setIsTraining(false);
        }
      };

      // Test prediction using the same feature encoding as training.
      const testPrediction = async () => {
        if (!model) {
          setPredictionResult('Train a model first.');
          return;
        }
        let inputTensor = null;
        let prediction = null;
        try {
          const input = encodeFeatures(predictionInput, featureSchema);
          inputTensor = tf.tensor2d([input]);
          prediction = model.predict(inputTensor);
          const scores = (await prediction.array())[0];
          const classIndex = scores.indexOf(Math.max(...scores));
          setPredictionResult(`Predicted: ${trainedLabels[classIndex]}`);
        } catch (error) {
          setPredictionResult(`Cannot predict: ${error.message}`);
        } finally {
          if (inputTensor) inputTensor.dispose();
          if (prediction) prediction.dispose();
        }
      };

      // Export model
      const exportModel = async () => {
        if (!model) {
          alert('Train a model first.');
          return;
        }
        await model.save('downloads://my-model');
        alert('Model downloaded as TensorFlow.js format (model.json + weights.bin).');
      };

      // Handle prediction input changes
      const handlePredictionInput = (feature, value) => {
        setPredictionInput({ ...predictionInput, [feature]: value });
      };

      return (
        <div className="container mx-auto p-4">
          <h1 className="text-2xl font-bold mb-4">AI Lab Clone</h1>
          <h2>A supervised machine learning classifier that uses a feedforward artificial neural network to learn patterns from labelled training data and predict categories for new inputs</h2>
          {/* CSV Upload */}
          <div className="mb-4">
            <label className="block text-lg font-medium">Upload CSV</label>
            <input type="file" accept=".csv" onChange={handleFileUpload} disabled={isTraining} className="mt-2" />
          </div>

          {/* Label Selection */}
          {columns.length > 0 && (
            <div className="mb-4">
              <label className="block text-lg font-medium">Select Label to Predict</label>
              <select
                className="border p-2 rounded"
                value={label}
                onChange={(e) => { resetTraining(); setLabel(e.target.value); setFeatures(prev => prev.filter(f => f !== e.target.value)); }}
                disabled={isTraining}
              >
                <option value="">Select a label</option>
                {columns.map(col => (
                  <option key={col} value={col}>{col}</option>
                ))}
              </select>
            </div>
          )}

          {/* Feature Selection */}
          {columns.length > 0 && (
            <div className="mb-4">
              <label className="block text-lg font-medium">Select Features</label>
              {columns.filter(col => col !== label).map(col => (
                <div key={col} className="flex items-center">
                  <input
                    type="checkbox"
                    checked={features.includes(col)}
                    onChange={() => {
                      resetTraining();
                      setFeatures(prev =>
                        prev.includes(col) ? prev.filter(f => f !== col) : [...prev, col]
                      );
                    }}
                    disabled={isTraining}
                    className="mr-2"
                  />
                  <span>{col}</span>
                </div>
              ))}
            </div>
          )}

          {/* Training settings and progress */}
          {csvData && (
            <div className="mb-4">
              <label htmlFor="epochs" className="block text-lg font-medium">Training epochs</label>
              <input
                id="epochs"
                type="number"
                min="1"
                max="10000"
                step="1"
                value={epochs}
                disabled={isTraining}
                onChange={(e) => setEpochs(e.target.value)}
                className="mt-2 border p-2 rounded w-32"
              />
              <p className="text-sm text-gray-600 mt-1">Choose 1–10,000 epochs. Default: 150.</p>
              <button
                onClick={trainModel}
                disabled={isTraining}
                className="mt-3 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50"
              >
                {isTraining ? 'Training...' : 'Train Model'}
              </button>
            </div>
          )}
          <p className="mt-2" role="status" aria-live="polite">{trainingStatus}</p>

          {/* Test Prediction */}
          {model && !isTraining && (
            <div className="mt-4">
              <h2 className="text-lg font-medium">Test Prediction</h2>
              <p className="text-sm text-gray-600 mb-2">Enter numbers for numerical features or text values from your CSV for categorical features.</p>
              {featureSchema.map((feature, index) => (
                <div key={feature.name} className="mb-3">
                  <label htmlFor={`prediction-${index}`} className="block">{feature.name}</label>
                  <input
                    id={`prediction-${index}`}
                    type={feature.type === 'number' ? 'number' : 'text'}
                    step={feature.type === 'number' ? 'any' : undefined}
                    list={feature.type === 'category' ? `categories-${index}` : undefined}
                    value={predictionInput[feature.name] ?? ''}
                    onChange={(e) => handlePredictionInput(feature.name, e.target.value)}
                    className="border p-2 rounded"
                  />
                  {feature.type === 'category' && (
                    <React.Fragment>
                      <datalist id={`categories-${index}`}>
                        {feature.categories.map(category => (
                          <option key={category} value={category} />
                        ))}
                      </datalist>
                      <p className="text-xs text-gray-600 mt-1">Text — choose a value found in the training data.</p>
                    </React.Fragment>
                  )}
                </div>
              ))}
              <button
                onClick={testPrediction}
                className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
              >
                Predict
              </button>
              <p className="mt-2" role="status">{predictionResult}</p>
            </div>
          )}

          {/* Export Button */}
          {model && (
            <button
              onClick={exportModel}
              className="mt-4 bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600"
            >
              Export Model
            </button>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
