name: Prepare CommonsSpeech teaching dataset
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_commons_speech.py'
      - '.github/workflows/prepare-commons-speech.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve original 5,200-speech sample
        run: |
          if [ ! -f data/commons-speech-original.json ]; then
            cp data/commons-speech-sample.json data/commons-speech-original.json
          fi
      - name: Download CommonsSpeech and create balanced small sample
        run: python scripts/prepare_commons_speech.py --out data/commons-speech-sample.json
      - name: Verify prepared sample
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d = json.loads(Path('data/commons-speech-sample.json').read_text())
          c = Counter(x['party'] for x in d['examples'])
          print('Classes:', c, 'MPs:', d['speakers'])
          assert set(c) == {'Labour', 'Conservative'} and min(c.values()) >= 3500
          assert len(d['examples']) >= 7000
          original = json.loads(Path('data/commons-speech-original.json').read_text())
          assert len(original['examples']) == 5200
          assert min(d['speakers'].values()) >= 8
          assert Path('data/commons-speech-sample.json').stat().st_size < 15_000_000
          PY
      - name: Commit only compact teaching sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commons-speech-original.json data/commons-speech-sample.json
          if git diff --cached --quiet; then
            echo "Teaching sample is unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "data: publish balanced CommonsSpeech teaching sample"

          # Other commits can land while the 1 GB source is being processed.
          # Always rebase on current main and never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Teaching sample published successfully."
              exit 0
            fi
            echo "Remote advanced during push (attempt ${attempt}/5); retrying."
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish teaching sample after five attempts."
          exit 1
