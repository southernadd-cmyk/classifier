name: Check neural network lab
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @babel/parser
      - run: node tests/smoke.cjs
      - run: node tests/speech-smoke.cjs
      - run: node --check speech-lab-ui.js
      - run: node --check speech-engine.js
      - run: python -m unittest discover -s tests -p 'test_prepare_commons.py'

  benchmark-speech:
    name: Benchmark speaker-held-out text models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - run: python tests/benchmark_speech.py
